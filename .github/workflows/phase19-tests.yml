name: Phase-19 Deterministic Tests

on:
  push:
    branches:
      - phase-19-e2e-harness
    paths-ignore:
      - "PROJECT_STATUS.md"
  workflow_dispatch:

jobs:
  phase19-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Phase-19 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile Phase-19 Solidity
        run: forge build --root . --contracts contracts --out out --cache-path .forge-cache
      - name: Run Phase-19 EVM integration harness
        run: forge test --root . --match-path tests/evm/Phase19Executor.t.sol -vv
      - name: Run Polygon fork protocol smoke harness
        run: |
          set -euo pipefail
          endpoints=(
            "https://polygon.drpc.org/"
            "https://public.1rpc.io/matic"
            "https://polygon-bor-rpc.publicnode.com"
          )
          for endpoint in "${endpoints[@]}"; do
            echo "Attempting Polygon fork endpoint: ${endpoint}"
            if forge test --root . --fork-url "${endpoint}" --match-path tests/evm/PolygonForkSmoke.t.sol -vv; then
              echo "Polygon fork smoke passed using ${endpoint}"
              exit 0
            fi
            echo "Polygon fork endpoint failed: ${endpoint}"
          done
          echo "All configured Polygon fork endpoints failed"
          exit 1
      - name: Run Polygon fork execution probe
        run: |
          set -euo pipefail
          endpoints=(
            "https://polygon.drpc.org/"
            "https://public.1rpc.io/matic"
            "https://polygon-bor-rpc.publicnode.com"
          )
          for endpoint in "${endpoints[@]}"; do
            echo "Attempting Polygon fork execution probe endpoint: ${endpoint}"
            if forge test --root . --fork-url "${endpoint}" --match-path tests/evm/PolygonForkExecutionProbe.t.sol -vv; then
              echo "Polygon fork execution probe passed using ${endpoint}"
              exit 0
            fi
            echo "Polygon fork execution probe endpoint failed: ${endpoint}"
          done
          echo "All configured Polygon fork execution probe endpoints failed"
          exit 1
      - name: Run Phase-19 unittest suite
        run: python -m unittest discover -s tests/phase19 -v
