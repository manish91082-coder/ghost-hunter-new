name: Phase-19 Deterministic Tests

on:
  push:
    branches:
      - phase-19-e2e-harness
  workflow_dispatch:

jobs:
  phase19-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Phase-19 unittest suite
        run: python -m unittest discover -s tests/phase19 -v
