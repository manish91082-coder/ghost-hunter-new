name: PHANTOMX S10 Candidate Refinement

on:
  # Candidate refinement is explicit/manual to prevent push-triggered RPC fan-out.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "manish91082-coder/ghost-hunter-new"
          test "${GITHUB_REF_NAME}" = "phase-19-e2e-harness"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "EXACT_HEAD=${GITHUB_SHA}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt
      - name: Refine candidate
        run: python scripts/s10_candidate_refine_live.py
      - uses: actions/upload-artifact@v4
        with:
          name: phantomx-s10-candidate-refinement
          path: artifacts/s10_candidate_refine.json
          if-no-files-found: error
