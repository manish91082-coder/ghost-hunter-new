name: PHANTOMX S2 Uniswap V4 Uniswap V3 Live Hunt

on:
  push:
    branches:
      - phase-19-e2e-harness
    paths:
      - "phantomx/uniswap_v4.py"
      - "phantomx/cross_venue_uv4_uv3_route.py"
      - "scripts/s2_uv4_uv3_live_scan.py"
      - ".github/workflows/s2-uv4-uv3-live-read.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phantomx-market-read-hunts-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  s2-live-read:
    name: S2 Uniswap V4 <-> Uniswap V3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact branch checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "manish91082-coder/ghost-hunter-new"
          test "${GITHUB_REF_NAME}" = "phase-19-e2e-harness"
          test -n "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "EXACT_HEAD=${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Phase-19 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt
      - name: Run S2 read-only live hunt
        run: python scripts/s2_uv4_uv3_live_scan.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: Publish S2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-s2-uv4-uv3-live-scan
          path: artifacts/s2_uv4_uv3_live_scan.json
          if-no-files-found: error