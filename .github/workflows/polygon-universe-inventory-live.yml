name: PHANTOMX Polygon Universe Inventory

on:
  push:
    branches:
      - phase-19-e2e-harness
    paths:
      - ".github/workflows/polygon-universe-inventory-live.yml"
      - "scripts/polygon_venue_inventory_live.py"
      - "scripts/balancer_v2_inventory_live.py"
      - "phantomx/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phantomx-polygon-universe-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "manish91082-coder/ghost-hunter-new"
          test "${GITHUB_REF_NAME}" = "phase-19-e2e-harness"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "EXACT_HEAD=${GITHUB_SHA}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt
      - name: Resolve scan range
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest=""
          urls=(
            "https://polygon.drpc.org/"
            "https://polygon-bor-rpc.publicnode.com"
            "https://public.1rpc.io/matic"
            "https://polygon.llamarpc.com"
            "https://polygon-rpc.polkachu.com"
            "https://polygon-mainnet-public.unifra.io"
          )
          for url in "${urls[@]}"; do
            response=$(curl -fsSL --max-time 8 -H "content-type: application/json" --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' "$url" 2>/dev/null || true)
            value=$(printf '%s' "$response" | python -c 'import json,sys; print(int(json.load(sys.stdin)["result"],16))' 2>/dev/null || true)
            if [ -n "$value" ]; then latest="$value"; break; fi
          done
          [ -n "$latest" ] || { echo "No free Polygon RPC returned a current head" >&2; exit 1; }
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          from=""
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=phantomx-polygon-inventory-cursor&per_page=1"
          archive=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" | python -c 'import json,sys; d=json.load(sys.stdin); print(d["artifacts"][0]["archive_download_url"] if d.get("artifacts") else "")')
          if [ -n "$archive" ]; then
            rm -rf /tmp/cursor && mkdir -p /tmp/cursor
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$archive" -o /tmp/cursor.zip
            unzip -oq /tmp/cursor.zip -d /tmp/cursor
            cursor=$(find /tmp/cursor -name cursor.json -type f | head -1 || true)
            if [ -n "$cursor" ]; then
              from=$(python - "$cursor" <<'PY'
import json,sys
print(json.load(open(sys.argv[1],encoding='utf-8'))['next_from_block'])
PY
)
            fi
          fi
          if [ -z "$from" ]; then from=0; fi
          to=$(( from + 100000 - 1 ))
          if [ "$to" -gt "$latest" ]; then to="$latest"; fi
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"
          echo "INVENTORY_RANGE=${from}-${to} LATEST=${latest}"
      - name: Run all six venue inventories
        env:
          FROM_BLOCK: ${{ steps.range.outputs.from }}
          TO_BLOCK: ${{ steps.range.outputs.to }}
        shell: bash
        run: |
          set -euo pipefail
          venues=(quickswap_v2 quickswap_v3 uniswap_v3 ramses_v3 uniswap_v4)
          rm -rf artifacts && mkdir -p artifacts
          for venue in "${venues[@]}"; do
            echo "=== INVENTORY ${venue} ==="
            PHANTOMX_INVENTORY_VENUE="$venue" PHANTOMX_INVENTORY_FROM_BLOCK="$FROM_BLOCK" PHANTOMX_INVENTORY_TO_BLOCK="$TO_BLOCK" PHANTOMX_INVENTORY_CHUNK_SIZE=2000 python scripts/polygon_venue_inventory_live.py
          done
          PHANTOMX_INVENTORY_FROM_BLOCK="$FROM_BLOCK" PHANTOMX_INVENTORY_TO_BLOCK="$TO_BLOCK" PHANTOMX_INVENTORY_CHUNK_SIZE=2000 python scripts/balancer_v2_inventory_live.py
      - name: Upload complete inventory slice
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-polygon-inventory-slice-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: error
      - name: Publish next cursor
        env:
          FROM_BLOCK: ${{ steps.range.outputs.from }}
          TO_BLOCK: ${{ steps.range.outputs.to }}
          LATEST_BLOCK: ${{ steps.range.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail
          next=$(( TO_BLOCK + 1 ))
          if [ "$TO_BLOCK" -ge "$LATEST_BLOCK" ]; then next=$(( LATEST_BLOCK > 4999 ? LATEST_BLOCK - 4999 : 0 )); fi
          mkdir -p cursor-out
          python - "$next" "$TO_BLOCK" > cursor-out/cursor.json <<'PY'
import json,sys
print(json.dumps({'schema_version':1,'next_from_block':int(sys.argv[1]),'next_to_block':int(sys.argv[2])}))
PY
      - name: Upload cursor
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-polygon-inventory-cursor
          path: cursor-out/cursor.json
          if-no-files-found: error