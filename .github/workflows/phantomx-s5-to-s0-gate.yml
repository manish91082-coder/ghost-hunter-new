name: PHANTOMX S5 to S0 Autonomous Gate

on:
  workflow_run:
    workflows:
      - "PHANTOMX S5 Curve Uniswap V3 Live Hunt"
    types:
      - completed
    branches:
      - phase-19-e2e-harness

permissions:
  actions: write
  contents: read

concurrency:
  group: phantomx-s5-to-s0-gate-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  advance:
    name: Advance S5 -> S0 only on certified S5 completion
    if: \${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'phase-19-e2e-harness' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current canonical branch
        uses: actions/checkout@v5
        with:
          ref: phase-19-e2e-harness
          fetch-depth: 0

      - name: Verify canonical repository and current head
        shell: bash
        env:
          S5_HEAD_SHA: \${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "\${GITHUB_REPOSITORY}" = "manish91082-coder/ghost-hunter-new"
          test "\${GITHUB_REF_NAME}" = "phase-19-e2e-harness"
          git fetch --no-tags origin phase-19-e2e-harness
          CURRENT_HEAD="\$(git rev-parse HEAD)"
          test "\${CURRENT_HEAD}" = "\$(git rev-parse origin/phase-19-e2e-harness)"
          git merge-base --is-ancestor "\${S5_HEAD_SHA}" "\${CURRENT_HEAD}"
          echo "CURRENT_HEAD=\${CURRENT_HEAD}"
          echo "S5_HEAD_SHA=\${S5_HEAD_SHA}"

      - name: Download the exact completed S5 evidence
        uses: actions/download-artifact@v4
        with:
          name: phantomx-s5-curve-uv3-live-scan
          path: artifacts/s5
          github-token: \${{ secrets.GITHUB_TOKEN }}
          repository: \${{ github.repository }}
          run-id: \${{ github.event.workflow_run.id }}

      - name: Validate S5 completion contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_s5_gate.py artifacts/s5/s5_curve_uv3_live_scan.json

      - name: Verify S5 artifact provenance
        shell: bash
        env:
          S5_HEAD_SHA: \${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python - "\${S5_HEAD_SHA}" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = sys.argv[1]
          payload = json.loads(Path("artifacts/s5/s5_curve_uv3_live_scan.json").read_text(encoding="utf-8"))
          actual = payload["provenance"]["git_commit_sha"]
          if actual != expected:
              raise SystemExit(f"BLOCKED: artifact provenance {actual} != triggering S5 head {expected}")
          print(f"S5_ARTIFACT_HEAD={actual}")
          PY

      - name: Check that no First-Hunt is already active
        shell: bash
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for status in in_progress queued; do
            count="\$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/\${GITHUB_REPOSITORY}/actions/workflows/first-hunt-live-read.yml/runs?branch=phase-19-e2e-harness&status=\${status}&per_page=100" \
              --jq '.total_count')"
            echo "FIRST_HUNT_\${status^^}_COUNT=\${count}"
            test "\${count}" = "0" || {
              echo "BLOCKED: an existing First-Hunt run is active; no overlapping hunt will be dispatched."
              exit 2
            }
          done

      - name: Dispatch S0 First-Hunt from the current verified branch
        shell: bash
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/\${GITHUB_REPOSITORY}/actions/workflows/first-hunt-live-read.yml/dispatches" \
            -f ref=phase-19-e2e-harness
          echo "S0_FIRST_HUNT_DISPATCH=SUCCESS"
          echo "ADVANCEMENT=S5 certified -> S0 live-read dispatched"
