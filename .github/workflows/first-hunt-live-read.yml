name: PHANTOMX First-Hunt Read-Only Live Scan

on:
  push:
    branches:
      - phase-19-e2e-harness
    paths:
      - "phantomx/aave_v3_dynamic.py"
      - "phantomx/cross_venue_discovery.py"
      - "phantomx/opportunity_discovery.py"
      - "phantomx/cross_venue_route.py"
      - "phantomx/dynamic_market_policy.py"
      - "phantomx/dynamic_route_guard.py"
      - "phantomx/market_block.py"
      - "phantomx/polygon_rpc_http.py"
      - "phantomx/quickswap_v2.py"
      - "phantomx/uniswap_v3.py"
      - "scripts/first_hunt_live_scan.py"
      - ".github/workflows/first-hunt-live-read.yml"
  pull_request:
    branches:
      - master
    paths:
      - "phantomx/**"
      - "scripts/first_hunt_live_scan.py"
      - ".github/workflows/first-hunt-live-read.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only one live-hunt may query Polygon at a time per branch. A newer hunt
# supersedes an older one to prevent stale-state scans and RPC bombardment.
concurrency:
  group: phantomx-first-hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-hunt-live-read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify exact branch checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "manish91082-coder/ghost-hunter-new"
          test "${GITHUB_REF_NAME}" = "phase-19-e2e-harness"
          test -n "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "EXACT_HEAD=${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Phase-19 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt

      - name: Diagnose Polygon RPC reachability
        run: |
          set -u
          for endpoint in             "https://polygon.drpc.org/"             "https://public.1rpc.io/matic"             "https://polygon-bor-rpc.publicnode.com"; do
            printf "RPC %s -> " "$endpoint"
            curl --silent --show-error --max-time 8               -H "Content-Type: application/json"               --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'               "$endpoint" | head -c 200 || true
            printf "\n"
          done

      - name: Run read-only First-Hunt scan
        run: python scripts/first_hunt_live_scan.py

      - name: Upload live scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-first-hunt-live-scan
          path: artifacts/first_hunt_live_scan.json
          if-no-files-found: error