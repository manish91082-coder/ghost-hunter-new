name: PHANTOMX Polygon Historical Universe Crawler

# P0: fixed-snapshot, contiguous, read-only inventory coverage. A successful slice is the only event that advances the campaign.

on:
  push:
    branches:
      - phase-19-e2e-harness
    paths:
      - ".github/PHANTOMX_HISTORY_KICK"
  workflow_dispatch:
    inputs:
      from_block:
        description: "Inclusive start block. Blank starts a new genesis-to-snapshot campaign."
        required: false
        default: ""
      snapshot_to_block:
        description: "Fixed inclusive campaign end block. Blank resolves the current Polygon head once."
        required: false
        default: ""
      slice_blocks:
        description: "Historical blocks scanned per continuation cycle."
        required: false
        default: "100000"
      campaign_id:
        description: "Stable campaign identifier. Blank resumes the latest certified campaign, or starts polygon-genesis-<snapshot_to_block>."
        required: false
        default: ""
      campaign_commit:
        description: "Immutable Git commit for this campaign. Blank resumes the latest certified campaign commit, or uses current HEAD for a new campaign."
        required: false
        default: ""
      continue_automatically:
        description: "Dispatch the next contiguous slice automatically."
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: phantomx-polygon-history-crawler-single-flight
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.context.outputs.commit_sha }}
      snapshot_to: ${{ steps.context.outputs.snapshot_to }}
      from_block: ${{ steps.context.outputs.from_block }}
      to_block: ${{ steps.context.outputs.to_block }}
      slice_blocks: ${{ steps.context.outputs.slice_blocks }}
      campaign_id: ${{ steps.context.outputs.campaign_id }}
      complete: ${{ steps.context.outputs.complete }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-19-e2e-harness
          fetch-depth: 0
      - name: Verify exact canonical checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "manish91082-coder/ghost-hunter-new"
          test "${GITHUB_REF_NAME}" = "phase-19-e2e-harness"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "EXACT_HEAD=${GITHUB_SHA}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Resolve immutable campaign context
        id: context
        env:
          INPUT_FROM: ${{ inputs.from_block }}
          INPUT_SNAPSHOT_TO: ${{ inputs.snapshot_to_block }}
          INPUT_SLICE: ${{ inputs.slice_blocks }}
          INPUT_CAMPAIGN: ${{ inputs.campaign_id }}
          INPUT_COMMIT: ${{ inputs.campaign_commit }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/context
          import json
          import os
          import sys
          import urllib.request
          import zipfile
          from io import BytesIO
          sys.path.insert(0, ".")

          CANONICAL_CAMPAIGN_ID = "polygon-genesis-94135487"
          CANONICAL_SNAPSHOT_TO = 94135487
          CANONICAL_COMMIT_SHA = "af4f6dc4ef007c503cef01c078e92e98a931ec3a"
          CANONICAL_FIRST_RESUME_FROM = 200000
          from phantomx.rpc_failover import build_free_polygon_rpc_pool

          def positive(name: str, default: int) -> int:
              raw = os.environ.get(name, "").strip()
              value = default if not raw else int(raw)
              if value < 1:
                  raise SystemExit(f"{name} must be >= 1")
              return value

          raw_snapshot = os.environ.get("INPUT_SNAPSHOT_TO", "").strip()
          raw_from = os.environ.get("INPUT_FROM", "").strip()
          raw_campaign = os.environ.get("INPUT_CAMPAIGN", "").strip()
          raw_commit = os.environ.get("INPUT_COMMIT", "").strip()

          def latest_certified_cursor():
              token = os.environ.get("GH_TOKEN", "").strip()
              repository = os.environ.get("GITHUB_REPOSITORY", "").strip()
              if not token or not repository:
                  return None
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repository + "/actions/artifacts?per_page=100",
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  items = json.loads(response.read().decode("utf-8")).get("artifacts", [])
              candidates = sorted(
                  (item for item in items if str(item.get("name", "")).startswith("phantomx-polygon-campaign-slice-") and not item.get("expired", False)),
                  key=lambda item: str(item.get("created_at", "")),
                  reverse=True,
              )
              for artifact in candidates:
                  archive_url = artifact.get("archive_download_url")
                  if not archive_url:
                      continue
                  try:
                      archive_request = urllib.request.Request(
                          archive_url,
                          headers={"Authorization": "Bearer " + token},
                      )
                      with urllib.request.urlopen(archive_request, timeout=30) as response:
                          archive_bytes = BytesIO(response.read())
                      with zipfile.ZipFile(archive_bytes) as archive:
                          with archive.open("campaign_slice_manifest.json") as manifest:
                              payload = json.loads(manifest.read().decode("utf-8"))
                      if (
                          payload.get("schema_version") == 1
                          and payload.get("campaign_id") == CANONICAL_CAMPAIGN_ID
                          and int(payload.get("campaign_snapshot_to_block", -1)) == CANONICAL_SNAPSHOT_TO
                          and str(payload.get("commit_sha", "")) == CANONICAL_COMMIT_SHA
                      ):
                          return payload
                  except Exception:
                      continue
              return None

          if not raw_from and not raw_snapshot and not raw_campaign and not raw_commit:
              cursor = latest_certified_cursor()
              if cursor:
                  raw_snapshot = str(cursor["campaign_snapshot_to_block"])
                  raw_from = str(cursor["next_from_block"]) if cursor.get("next_from_block") is not None else str(int(cursor["campaign_snapshot_to_block"]) + 1)
                  raw_campaign = str(cursor["campaign_id"])
                  raw_commit = str(cursor["commit_sha"])
          if raw_campaign and raw_campaign != CANONICAL_CAMPAIGN_ID:
              raise SystemExit(
                  f"non-canonical campaign_id rejected: {raw_campaign} != {CANONICAL_CAMPAIGN_ID}"
              )
          if raw_snapshot and int(raw_snapshot) != CANONICAL_SNAPSHOT_TO:
              raise SystemExit(
                  f"non-canonical snapshot_to_block rejected: {raw_snapshot} != {CANONICAL_SNAPSHOT_TO}"
              )
          if raw_commit and raw_commit != CANONICAL_COMMIT_SHA:
              raise SystemExit(
                  f"non-canonical campaign_commit rejected: {raw_commit} != {CANONICAL_COMMIT_SHA}"
              )

          campaign_commit = raw_commit or (
              CANONICAL_COMMIT_SHA if raw_campaign == CANONICAL_CAMPAIGN_ID else os.environ["GITHUB_SHA"]
          )
          slice_blocks = positive("INPUT_SLICE", 100_000)

          if raw_snapshot:
              snapshot_to = int(raw_snapshot)
          else:
              pool = build_free_polygon_rpc_pool()
              latest = int(str(pool.call("eth_blockNumber")), 16)
              chain_id = int(str(pool.call("eth_chainId")), 16)
              if chain_id != 137:
                  raise SystemExit(f"unexpected Polygon chain id: {chain_id}")
              snapshot_to = latest

          # This repository owns one canonical historical campaign. Never bind
          # that campaign ID to a live-head snapshot by accident.
          snapshot_to = CANONICAL_SNAPSHOT_TO

          if snapshot_to < 0:
              raise SystemExit("snapshot_to_block must be >= 0")

          if raw_from:
              from_block = int(raw_from)
          elif raw_campaign == CANONICAL_CAMPAIGN_ID or raw_snapshot == str(CANONICAL_SNAPSHOT_TO) or raw_commit == CANONICAL_COMMIT_SHA:
              from_block = CANONICAL_FIRST_RESUME_FROM
          else:
              from_block = CANONICAL_FIRST_RESUME_FROM
          if from_block < 0 or from_block > snapshot_to:
              raise SystemExit("from_block must be within the campaign snapshot")

          to_block = min(snapshot_to, from_block + slice_blocks - 1)
          campaign = raw_campaign or CANONICAL_CAMPAIGN_ID
          if campaign != CANONICAL_CAMPAIGN_ID:
              raise SystemExit(f"resolved non-canonical campaign: {campaign}")
          complete = "true" if from_block > snapshot_to else "false"

          print(f"commit_sha={campaign_commit}")
          print(f"snapshot_to={snapshot_to}")
          print(f"from_block={from_block}")
          print(f"to_block={to_block}")
          print(f"slice_blocks={slice_blocks}")
          print(f"campaign_id={campaign}")
          print(f"complete={complete}")
          PY
          cat /tmp/context >> "$GITHUB_OUTPUT"
          cat /tmp/context

  inventory:
    needs: resolve
    if: needs.resolve.outputs.complete != 'true'
    strategy:
      fail-fast: false
      matrix:
        venue:
          - quickswap_v2
          - quickswap_v3
          - uniswap_v3
          - ramses_v3
          - uniswap_v4
          - balancer_v2
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}
          fetch-depth: 0
      - name: Verify immutable campaign checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "manish91082-coder/ghost-hunter-new"
          test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.commit_sha }}"
          echo "CAMPAIGN_COMMIT=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt
      - name: Run generic venue inventory
        if: matrix.venue != 'balancer_v2'
        env:
          PHANTOMX_INVENTORY_VENUE: ${{ matrix.venue }}
          PHANTOMX_INVENTORY_FROM_BLOCK: ${{ needs.resolve.outputs.from_block }}
          PHANTOMX_INVENTORY_TO_BLOCK: ${{ needs.resolve.outputs.to_block }}
          PHANTOMX_INVENTORY_PINNED_BLOCK: ${{ needs.resolve.outputs.to_block }}
          PHANTOMX_INVENTORY_CHUNK_SIZE: "50"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/polygon_venue_inventory_live.py
      - name: Run Balancer V2 inventory
        if: matrix.venue == 'balancer_v2'
        env:
          PHANTOMX_INVENTORY_FROM_BLOCK: ${{ needs.resolve.outputs.from_block }}
          PHANTOMX_INVENTORY_TO_BLOCK: ${{ needs.resolve.outputs.to_block }}
          PHANTOMX_INVENTORY_PINNED_BLOCK: ${{ needs.resolve.outputs.to_block }}
          PHANTOMX_INVENTORY_CHUNK_SIZE: "50"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/balancer_v2_inventory_live.py
      - name: Publish venue slice evidence
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-polygon-history-${{ matrix.venue }}
          path: artifacts/*.json
          if-no-files-found: error

  certify_slice:
    needs: [resolve, inventory]
    if: needs.resolve.outputs.complete != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}
          fetch-depth: 0
      - name: Download venue evidence
        uses: actions/download-artifact@v4
        with:
          pattern: phantomx-polygon-history-*
          merge-multiple: true
          path: artifacts
      - name: Certify contiguous slice and build campaign cursor
        env:
          EXPECTED_FROM: ${{ needs.resolve.outputs.from_block }}
          EXPECTED_TO: ${{ needs.resolve.outputs.to_block }}
          SNAPSHOT_TO: ${{ needs.resolve.outputs.snapshot_to }}
          SLICE_BLOCKS: ${{ needs.resolve.outputs.slice_blocks }}
          CAMPAIGN_ID: ${{ needs.resolve.outputs.campaign_id }}
          COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
          AUTO_CONTINUE: ${{ inputs.continue_automatically || 'true' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          expected_venues = {
              "quickswap_v2",
              "quickswap_v3",
              "uniswap_v3",
              "ramses_v3",
              "uniswap_v4",
              "balancer_v2",
          }
          from_block = int(os.environ["EXPECTED_FROM"])
          to_block = int(os.environ["EXPECTED_TO"])
          snapshot_to = int(os.environ["SNAPSHOT_TO"])

          artifacts = {}
          for path in glob.glob("artifacts/*.json"):
              raw = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              venue = str(raw.get("venue", "")).lower()
              if venue:
                  if venue in artifacts:
                      raise SystemExit(f"duplicate venue evidence: {venue}")
                  artifacts[venue] = raw

          missing = sorted(expected_venues - set(artifacts))
          if missing:
              raise SystemExit(f"missing venue evidence: {missing}")

          allowed = {"QUOTED", "ONCHAIN_UNAVAILABLE", "QUOTED_PARTIAL"}
          evidence = []
          for venue in sorted(expected_venues):
              raw = artifacts[venue]
              start = int(raw.get("from_block", -1))
              end = int(raw.get("to_block", -1))
              status = str(raw.get("status", ""))
              if start != from_block or end != to_block:
                  raise SystemExit(f"{venue}: block range mismatch {start}-{end}, expected {from_block}-{to_block}")
              if status not in allowed:
                  raise SystemExit(f"{venue}: non-terminal inventory status {status}")
              evidence.append({
                  "venue": venue,
                  "status": status,
                  "evidence_hash": str(raw.get("evidence_hash", raw.get("artifact_hash", ""))),
                  "log_count": int(raw.get("log_count", 0)),
                  "edge_count": int(raw.get("edge_count", 0)),
              })

          payload = {
              "schema_version": 1,
              "mission": "PHANTOMX POLYGON HISTORICAL INVENTORY CAMPAIGN",
              "campaign_id": os.environ["CAMPAIGN_ID"],
              "chain_id": 137,
              "campaign_snapshot_to_block": snapshot_to,
              "slice_from_block": from_block,
              "slice_to_block": to_block,
              "next_from_block": None if to_block >= snapshot_to else to_block + 1,
              "commit_sha": os.environ["COMMIT_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "venue_count": len(expected_venues),
              "venue_evidence": evidence,
              "read_only": True,
              "signing": False,
              "submission": False,
              "broadcast": False,
              "live_capital": False,
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          payload["slice_manifest_hash"] = hashlib.sha256(canonical).hexdigest()
          pathlib.Path("artifacts/campaign_slice_manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True),
              encoding="utf-8",
          )

          next_from = payload["next_from_block"]
          print(json.dumps(payload, indent=2, sort_keys=True))

          if next_from is not None and os.environ.get("AUTO_CONTINUE", "true").lower() == "true":
              request_payload = json.dumps({
                  "ref": "phase-19-e2e-harness",
                  "inputs": {
                      "from_block": str(next_from),
                      "snapshot_to_block": str(snapshot_to),
                      "slice_blocks": os.environ["SLICE_BLOCKS"],
                      "campaign_id": os.environ["CAMPAIGN_ID"],
                    "campaign_commit": os.environ["COMMIT_SHA"],
                      "continue_automatically": "true",
                  },
              }).encode()
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] +
                  "/actions/workflows/polygon-universe-history-crawler.yml/dispatches",
                  data=request_payload,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 204:
                      raise SystemExit(f"unexpected workflow dispatch status: {response.status}")
              print(f"AUTO_CONTINUED from_block={next_from}")
          elif next_from is None:
              print("HISTORICAL_CAMPAIGN_COMPLETE")
          else:
              print("AUTO_CONTINUE_DISABLED")
          PY
      - name: Publish certified campaign slice
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-polygon-campaign-slice-${{ github.run_id }}
          path: artifacts/campaign_slice_manifest.json
          if-no-files-found: error
