name: PHANTOMX Polygon Inventory Diagnostic

on:
  push:
    branches:
      - phase-19-e2e-harness
    paths:
      - ".github/workflows/polygon-inventory-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "manish91082-coder/ghost-hunter-new"
          test "${GITHUB_REF_NAME}" = "phase-19-e2e-harness"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "EXACT_HEAD=${GITHUB_SHA}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt
      - name: Run Uniswap V3 inventory
        env:
          PHANTOMX_INVENTORY_VENUE: uniswap_v3
          PHANTOMX_INVENTORY_WINDOW_BLOCKS: "5000"
          PHANTOMX_INVENTORY_CHUNK_SIZE: "2000"
        run: python scripts/polygon_venue_inventory_live.py
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-polygon-inventory-diagnostic
          path: artifacts/polygon_inventory_uniswap_v3_*.json
          if-no-files-found: error