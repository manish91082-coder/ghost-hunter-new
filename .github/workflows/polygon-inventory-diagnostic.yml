name: PHANTOMX Polygon Universe Inventory

on:
  push:
    branches:
      - phase-19-e2e-harness
    paths:
      - ".github/workflows/polygon-inventory-diagnostic.yml"
      - "scripts/polygon_venue_inventory_live.py"
      - "scripts/balancer_v2_inventory_live.py"
      - "phantomx/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phantomx-polygon-universe-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "manish91082-coder/ghost-hunter-new"
          test "${GITHUB_REF_NAME}" = "phase-19-e2e-harness"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "EXACT_HEAD=${GITHUB_SHA}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt
      - name: Run five generic venue inventories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts && mkdir -p artifacts
          for venue in quickswap_v2 quickswap_v3 uniswap_v3 ramses_v3 uniswap_v4; do
            echo "=== INVENTORY ${venue} ==="
            PHANTOMX_INVENTORY_VENUE="$venue" PHANTOMX_INVENTORY_WINDOW_BLOCKS=5000 PHANTOMX_INVENTORY_CHUNK_SIZE=2000 python scripts/polygon_venue_inventory_live.py
          done
      - name: Run Balancer V2 inventory
        env:
          PHANTOMX_INVENTORY_WINDOW_BLOCKS: "5000"
          PHANTOMX_INVENTORY_CHUNK_SIZE: "50"
        run: python scripts/balancer_v2_inventory_live.py
      - name: Upload inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-polygon-inventory-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: error