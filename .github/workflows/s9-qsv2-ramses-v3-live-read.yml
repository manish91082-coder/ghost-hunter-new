name: PHANTOMX S9 QuickSwap V2 Ramses V3 Live Hunt

on:
  push:
    branches:
      - phase-19-e2e-harness
    paths:
      - "phantomx/quickswap_v2.py"
      - "phantomx/ramses_v3.py"
      - "phantomx/cross_venue_qsv2_ramses_v3_route.py"
      - "scripts/s9_qsv2_ramses_v3_live_scan.py"
      - "phantomx/dynamic_*.py"
      - "phantomx/strategy_registry.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phantomx-market-read-hunts
  cancel-in-progress: true

jobs:
  s9-live-read:
    name: S9 QuickSwap V2 <-> Ramses V3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Phase-19 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt
      - name: Run S9 read-only live hunt
        run: python scripts/s9_qsv2_ramses_v3_live_scan.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: Publish S9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-s9-qsv2-ramses-v3-live-scan
          path: artifacts/s9_qsv2_ramses_v3_live_scan.json
          if-no-files-found: error
