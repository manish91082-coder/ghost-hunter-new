name: PHANTOMX S3 Ramses V3 Live Hunt

on:
  push:
    branches:
      - phase-19-e2e-harness
    paths:
      - "phantomx/ramses_v3.py"
      - "phantomx/cross_venue_ramses_v3_route.py"
      - "scripts/s3_ramses_uv3_live_scan.py"
      - "phantomx/dynamic_*.py"
      - ".github/workflows/s3-ramses-uv3-live-read.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phantomx-market-read-hunts-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  s3-live-read:
    name: S3 Ramses V3 <-> Uniswap V3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact branch checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "manish91082-coder/ghost-hunter-new"
          test "${GITHUB_REF_NAME}" = "phase-19-e2e-harness"
          test -n "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "EXACT_HEAD=${GITHUB_SHA}"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Phase-19 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt
      - name: Run S3 read-only live hunt
        run: python scripts/s3_ramses_uv3_live_scan.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: Publish S3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-s3-ramses-uv3-live-scan
          path: artifacts/s3_ramses_uv3_live_scan.json
          if-no-files-found: error
