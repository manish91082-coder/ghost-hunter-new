name: PHANTOMX S5 Curve Uniswap V3 Live Hunt

on:
  # Market-hunt execution is explicit/manual to prevent push-triggered RPC fan-out.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phantomx-market-read-hunts-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  s5-live-read:
    name: S5 Curve <-> Uniswap V3
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact branch checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "manish91082-coder/ghost-hunter-new"
          test "${GITHUB_REF_NAME}" = "phase-19-e2e-harness"
          test -n "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "EXACT_HEAD=${GITHUB_SHA}"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Phase-19 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt
      - name: Run S5 read-only live hunt
        run: python scripts/s5_curve_uv3_live_scan.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: Publish S5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-s5-curve-uv3-live-scan
          path: artifacts/s5_curve_uv3_live_scan.json
          if-no-files-found: error
# current-head refresh trigger: 2026-09-21 after S3 completion
# current-head clean rerun trigger: 2026-09-21 after Curve pair-surface repair
# current-head bounded proof rerun: 2026-09-21 after S9/S10 evidence sync
# current-head tree-integrity correction rerun: 2026-09-21 after atomic tree repair
