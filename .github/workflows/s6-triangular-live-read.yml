name: PHANTOMX S6 Triangular Live Hunt

on:
  # Market-hunt execution is explicit/manual to prevent push-triggered RPC fan-out.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phantomx-s6-triangular-live-hunt
  cancel-in-progress: true

jobs:
  s6-live-read:
    name: S6 Triangular 3-Venue V3 / ${{ matrix.bridge_pair.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        bridge_pair:
          - id: WETH-WPOL
            names: "WETH,WPOL"
          - id: WETH-DAI
            names: "WETH,DAI"
          - id: WETH-USDT-e
            names: "WETH,USDT.e"
          - id: WETH-MIMATIC
            names: "WETH,MIMATIC"
          - id: WETH-WBTC
            names: "WETH,WBTC"
          - id: WETH-LINK
            names: "WETH,LINK"
          - id: WPOL-DAI
            names: "WPOL,DAI"
          - id: WPOL-USDT-e
            names: "WPOL,USDT.e"
          - id: WPOL-MIMATIC
            names: "WPOL,MIMATIC"
          - id: WPOL-WBTC
            names: "WPOL,WBTC"
          - id: WPOL-LINK
            names: "WPOL,LINK"
          - id: DAI-USDT-e
            names: "DAI,USDT.e"
          - id: DAI-MIMATIC
            names: "DAI,MIMATIC"
          - id: DAI-WBTC
            names: "DAI,WBTC"
          - id: DAI-LINK
            names: "DAI,LINK"
          - id: USDT-e-MIMATIC
            names: "USDT.e,MIMATIC"
          - id: USDT-e-WBTC
            names: "USDT.e,WBTC"
          - id: USDT-e-LINK
            names: "USDT.e,LINK"
          - id: MIMATIC-WBTC
            names: "MIMATIC,WBTC"
          - id: MIMATIC-LINK
            names: "MIMATIC,LINK"
          - id: WBTC-LINK
            names: "WBTC,LINK"
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact branch checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "manish91082-coder/ghost-hunter-new"
          test "${GITHUB_REF_NAME}" = "phase-19-e2e-harness"
          test -n "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "EXACT_HEAD=${GITHUB_SHA}"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Phase-19 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt
      - name: Report S6 matrix scope
        run: |
          echo "S6 bridge pair: ${{ matrix.bridge_pair.names }}"
          echo "S6 pair id: ${{ matrix.bridge_pair.id }}"
      - name: Run S6 read-only live hunt
        run: python scripts/s6_triangular_live_scan.py
        env:
          PYTHONUNBUFFERED: "1"
          PHANTOMX_S6_BRIDGE_NAMES: ${{ matrix.bridge_pair.names }}
      - name: Publish S6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-s6-triangular-live-scan-${{ matrix.bridge_pair.id }}
          path: artifacts/s6_triangular_live_scan.json
          if-no-files-found: error