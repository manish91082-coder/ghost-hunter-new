name: PHANTOMX S6 Triangular Live Hunt

on:
  push:
    branches:
      - phase-19-e2e-harness
    paths:
      - "phantomx/triangular_route.py"
      - "scripts/s6_triangular_live_scan.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phantomx-s6-triangular-live-hunt
  cancel-in-progress: true

jobs:
  s6-live-read:
    name: S6 Triangular 3-Venue V3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Phase-19 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt
      - name: Run S6 read-only live hunt
        run: python scripts/s6_triangular_live_scan.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: Publish S6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-s6-triangular-live-scan
          path: artifacts/s6_triangular_live_scan.json
          if-no-files-found: error
