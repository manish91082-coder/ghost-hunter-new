name: PHANTOMX S5A Curve MAI Forensic Probe

on:
  # Market-hunt execution is explicit/manual to prevent push-triggered RPC fan-out.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phantomx-s5a-forensic-probe
  cancel-in-progress: true

jobs:
  s5a-probe:
    name: Curve MAI USDC.e forensic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Phase-19 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt
      - name: Run read-only forensic probe
        run: python scripts/s5a_curve_mai_probe.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: Publish forensic evidence
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-s5a-curve-mai-probe
          path: artifacts/s5a_curve_mai_probe.json
          if-no-files-found: error
