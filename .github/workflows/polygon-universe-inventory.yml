name: PHANTOMX Polygon Universe Inventory Slice

on:
  push:
    branches:
      - phase-19-e2e-harness
    paths:
      - "phantomx/polygon_log_inventory.py"
      - "phantomx/polygon_venue_inventory.py"
      - "phantomx/polygon_universe_inventory.py"
      - "phantomx/rpc_failover.py"
      - "scripts/polygon_inventory_slice.py"
      - ".github/workflows/polygon-universe-inventory.yml"
  workflow_dispatch:
    inputs:
      from_block:
        description: "Inclusive Polygon block start. Leave blank to start at 0."
        required: false
        default: "0"
      slice_blocks:
        description: "Blocks in this slice."
        required: false
        default: "25000"
      to_block:
        description: "Inclusive final block. Blank uses current head."
        required: false
        default: ""
      venues:
        description: "Comma-separated venue ids. Blank means all registered venues."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: phantomx-polygon-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Polygon universe inventory slice
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "manish91082-coder/ghost-hunter-new"
          test "${GITHUB_REF_NAME}" = "phase-19-e2e-harness"
          test -n "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "EXACT_HEAD=${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase19.txt

      - name: Run inventory slice
        env:
          PYTHONUNBUFFERED: "1"
          PHANTOMX_INVENTORY_FROM_BLOCK: "${{ inputs.from_block || '0' }}"
          PHANTOMX_INVENTORY_SLICE_BLOCKS: "${{ inputs.slice_blocks || '25000' }}"
          PHANTOMX_INVENTORY_TO_BLOCK: "${{ inputs.to_block || '-1' }}"
          PHANTOMX_INVENTORY_VENUES: "${{ inputs.venues || '' }}"
        run: |
          set +e
          python scripts/polygon_inventory_slice.py
          rc=$?
          echo "INVENTORY_RC=$rc"
          if [ "$rc" -eq 2 ]; then
            echo "Inventory slice reached RPC exhaustion; artifact is retryable evidence, not market absence."
            exit 0
          fi
          exit "$rc"

      - name: Publish inventory checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-polygon-inventory-slice
          path: artifacts/polygon_inventory_slice.json
          if-no-files-found: error
